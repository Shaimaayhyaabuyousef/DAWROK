name: Firestore rules validation
on:
  push:
    branches:
      - feature/firebase-facilities-queues-bookings
  pull_request:
    branches: [main]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install test dependencies
        run: npm install --prefix scripts --no-save @firebase/rules-unit-testing@latest
      - name: Compile and exercise Firestore rules
        run: npx --yes firebase-tools@latest emulators:exec --project demo-dawrok --only firestore 'node scripts/validate_firestore_rules.mjs'
