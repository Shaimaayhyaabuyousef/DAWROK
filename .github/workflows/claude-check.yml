name: Claude work-branch checks
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: flutter pub get
      - name: Build web
        run: |
          set +e
          flutter build web -t lib/showcase_main.dart --release --no-tree-shake-icons > build.txt 2>&1; code=$?
          tail -40 build.txt
          grep -nE 'Error|error:' build.txt | head -30 > be.txt || true
          [ -s be.txt ] && echo "::error title=build::$(sed ':a;N;$!ba;s/\n/%0A/g' be.txt)"
          exit $code
      - run: npm install --prefix showcase && npx --prefix showcase playwright install --with-deps chromium
      - name: Capture
        run: |
          set +e
          npx --yes firebase-tools@latest emulators:exec --config firebase.showcase.json --project demo-dawrok --only auth,firestore 'node showcase/drive.mjs' > drive.txt 2>&1
          tail -20 drive.txt
          grep -E 'SEED|: (ready|timeout|failed)|callnext|ERROR|SHOWCASE' shots/console.txt | head -60 > sum.txt || true
          echo "::notice title=summary::$(sed ':a;N;$!ba;s/\n/%0A/g' sum.txt)"
          cp drive.txt shots/ 2>/dev/null
          git config user.name "github-actions" && git config user.email "actions@github.com"
          mkdir -p /tmp/out && cp -r shots/* /tmp/out/
          git checkout --orphan shots-tmp && git rm -rq --cached . && rm -rf ./* .firebaserc 2>/dev/null
          cp -r /tmp/out/* . && git add -A && git commit -qm "showcase ${GITHUB_SHA::7}"
          git push -f origin HEAD:claude/shots
