name: Claude work-branch checks
on:
  push:
    branches: ['claude/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Render screens
        run: |
          set +e
          flutter test --update-goldens test_preview > shots.txt 2>&1
          tail -3 shots.txt
          grep -n -m3 -A12 'EXCEPTION CAUGHT' shots.txt > sx.txt || true
          [ -s sx.txt ] && echo "::warning title=shots::$(sed ':a;N;$!ba;s/\n/%0A/g' sx.txt)"
          mkdir -p /tmp/out && cp -r test_preview/goldens /tmp/out/ 2>/dev/null; cp shots.txt /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git fetch origin claude/shots 2>/dev/null
          git checkout --orphan shots-tmp && git rm -rq --cached . && rm -rf ./*
          cp -r /tmp/out/* . && git add -A && git commit -qm "screens ${GITHUB_SHA::7}"
          git push -f origin HEAD:claude/shots
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true
          grep -E '^\s*error' analyze.txt > errors.txt || true
          echo "errors: $(wc -l < errors.txt)"
          split -l 12 errors.txt chunk_ || true
          for f in chunk_*; do [ -f "$f" ] && echo "::error title=analyze::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
          grep -E '^\s*warning' analyze.txt | head -24 > warn.txt || true
          [ -s warn.txt ] && echo "::warning title=analyze-warnings::$(sed ':a;N;$!ba;s/\n/%0A/g' warn.txt)"
          test ! -s errors.txt
      - name: Tests
        if: always()
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1; code=$?
          tail -5 test.txt
          grep -nE 'FAILED|\[E\]|Error:|Expected:|Actual:|error:|Which:' test.txt | head -60 > tfail.txt || true
          split -l 10 tfail.txt tchunk_ || true
          for f in tchunk_*; do [ -f "$f" ] && echo "::error title=test::$(sed ':a;N;$!ba;s/\n/%0A/g' "$f")"; done
          grep -n -m1 -A22 'EXCEPTION CAUGHT' test.txt > exc.txt || true
          [ -s exc.txt ] && echo "::error title=first-exception::$(sed ':a;N;$!ba;s/\n/%0A/g' exc.txt)"
          echo "::notice title=test-summary::$(tail -2 test.txt | tr '\n' ' ')"
          exit $code
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --prefix scripts --no-save @firebase/rules-unit-testing@latest
      - name: Rules
        run: |
          set +e
          npx --yes firebase-tools@latest emulators:exec --project demo-dawrok --only firestore 'node scripts/validate_firestore_rules.mjs && node scripts/validate_queue_windows.mjs' > rules.txt 2>&1; code=$?
          grep -nEi 'error|fail|assert|denied|✗' rules.txt | head -30 > rf.txt || true
          [ -s rf.txt ] && echo "::error title=rules::$(sed ':a;N;$!ba;s/\n/%0A/g' rf.txt)"
          tail -5 rules.txt
          exit $code
